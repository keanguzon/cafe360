<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#FCFBF9" />
    <title>Offline | Cafe360</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fcfbf9; color: #1c1b1a; }
      body { box-sizing: border-box; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 2rem; }
      main { max-width: 28rem; width: 100%; }
      h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.1; margin: 0 0 1rem; }
      p { font-size: 1rem; line-height: 1.5; margin: 0 0 1.5rem; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 1.25rem; border-radius: 0.75rem; background: #382215; color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #1c1b1a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to open Cafe360 and see your Circles and café memories.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
